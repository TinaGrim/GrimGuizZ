# Render "Blueprint" — point Render at this file via
# `New > Blueprint > Connect repo` and it will create the service
# automatically. The Docker image is built from backend/Dockerfile.
#
# This file is intentionally minimal: everything else is either baked
# into the image (deps) or set via env-vars / secrets (config).
services:
  - type: web
    name: quizz-api
    runtime: docker
    rootDir: backend
    # Free plan: no persistent disk, instance sleeps after inactivity.
    # Uploaded media therefore lives in Cloudflare R2 (see R2_* below),
    # not on the container filesystem, which is wiped on every redeploy.
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # ─── Required ───────────────────────────────────────────────────
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: quizz
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      # ─── Media storage (Cloudflare R2 free tier) ────────────────────
      # The Render container filesystem is ephemeral, so uploads go to an
      # R2 bucket and are served from R2_PUBLIC_BASE_URL (the bucket's
      # public URL, e.g. https://pub-<hash>.r2.dev). Set these in the
      # dashboard Environment for the existing service; they're sync:false
      # on purpose so blueprint syncs never overwrite your keys.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      # `QUIZZ_ENV=production` flips the dev-secret warning into a
      # hard startup error, so a misconfigured deploy can't run with
      # the publicly-known default secret.
      - key: QUIZZ_ENV
        value: production
      # ─── Optional but recommended ──────────────────────────────────
      - key: SEED_TEACHER_USERNAME
        value: teacher
      - key: SEED_TEACHER_PASSWORD
        generateValue: true